name: Deploy Churchpress to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - index.html
      - firebase.json
      - firebase.public.json
      - public/**
      - scripts/prepare-public-hosting.sh
      - scripts/prepare-hosting.sh
      - .github/workflows/firebase-hosting.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    # Setup creates these repository variables. Until then, merging is safe:
    # the job skips instead of attempting an unauthenticated deployment.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare public files
        run: bash scripts/prepare-hosting.sh
      - name: Prepare public website
        if: vars.FIREBASE_PUBLIC_SITE_ENABLED == 'true'
        run: bash scripts/prepare-public-hosting.sh
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: high-church-notices
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy website
        run: npx --yes firebase-tools@15.34.1 deploy --only hosting --project high-church-notices --non-interactive
      - name: Deploy public website
        if: vars.FIREBASE_PUBLIC_SITE_ENABLED == 'true'
        run: npx --yes firebase-tools@15.34.1 deploy --only hosting --config firebase.public.json --project high-church-notices --non-interactive
